name: Deploy Staging

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build ARM64 & Deploy to ECS
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: fynk-staging-cluster
      DEPLOY_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/fynk-staging-github-deploy-role

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC - Zero Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ARM64 Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building ARM64 container images..."
          docker buildx build --platform linux/arm64 -t $ECR_REGISTRY/fynk-api:$IMAGE_TAG -t $ECR_REGISTRY/fynk-api:latest ./services/api --push
          docker buildx build --platform linux/arm64 -t $ECR_REGISTRY/fynk-keycloak:$IMAGE_TAG -t $ECR_REGISTRY/fynk-keycloak:latest ./services/keycloak --push
          docker buildx build --platform linux/arm64 -t $ECR_REGISTRY/fynk-bank-simulator:$IMAGE_TAG -t $ECR_REGISTRY/fynk-bank-simulator:latest ./services/bank-simulator --push

      - name: Deploy to Amazon ECS
        run: |
          echo "Triggering ECS Fargate rolling updates..."
          aws ecs update-service --cluster $ECS_CLUSTER --service fynk-staging-api --force-new-deployment
          aws ecs update-service --cluster $ECS_CLUSTER --service fynk-staging-keycloak --force-new-deployment
          aws ecs update-service --cluster $ECS_CLUSTER --service fynk-staging-bank-simulator --force-new-deployment

      - name: Wait for Services Stability
        run: |
          echo "Waiting for ECS services to reach steady state..."
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services fynk-staging-api fynk-staging-keycloak fynk-staging-bank-simulator

      - name: Run Smoke Tests
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh fynk.club
