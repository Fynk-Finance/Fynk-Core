name: Set up Node and pnpm
description: Node 22.20.0, pnpm from the packageManager field (corepack), a cached store and a frozen install.

inputs:
  install-args:
    description: Extra arguments for pnpm install, for example "--filter fynk" for the root tools only.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.20.0
        # The pnpm store is cached below, after corepack provides pnpm.
        package-manager-cache: false

    - name: Enable corepack (pnpm version from package.json)
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        corepack enable
        pnpm --version
        echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: pnpm install
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      # INSTALL_ARGS is left unquoted on purpose so it splits into separate arguments.
      run: pnpm install --frozen-lockfile $INSTALL_ARGS
