openapi: 3.1.0
info:
  title: Banco Demo API (simulado)
  version: 0.1.0
  description: >-
    Simulated Open Finance data provider with several fictional entities (Banco Demo, Billetera Demo,
    Banco Digital Demo and Cooperativa Demo). Not a real bank. All data is synthetic and marked as simulated.
    Two listeners serve this API. The authorization page (GET /oauth/authorize) lives on the public listener.
    Every other path lives on the internal mTLS listener, reached through the Caddy egress.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://bancodemo.fynk.local
    description: Internal mTLS listener, reached through the Caddy egress
  - url: http://localhost:8082
    description: Local public listener
tags:
  - name: accounts
    description: Accounts covered by consent
  - name: transactions
    description: Transactions pagination
  - name: consents
    description: Consent lifecycle
  - name: products
    description: Public product catalogs
  - name: oauth
    description: OAuth 2.0 endpoints (PAR, authorization page and token) with PKCE and private_key_jwt
  - name: demo
    description: Demo only provisioning. Not part of any real bank API
paths:
  /open-finance/v1/accounts:
    get:
      tags: [accounts]
      summary: Accounts covered by consent
      description: Returns accounts associated with the authorized consent.
      operationId: getAccounts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of accounts covered by the active consent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /open-finance/v1/accounts/{id}/transactions:
    get:
      tags: [transactions]
      summary: Account transactions
      description: Returns booked and pending movements for an account, newest first, cursor-based pagination.
      operationId: getAccountTransactions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Account identifier
          schema:
            type: string
        - name: fromBookingDate
          in: query
          required: false
          description: Filter transactions booked on or after this ISO datetime or date
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Pagination cursor for next page
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: Page size, max 200 (default 50)
          schema:
            type: integer
            maximum: 200
            default: 50
      responses:
        '200':
          description: Page of transactions.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    type: object
                    required: [hasMore]
                    properties:
                      hasMore:
                        type: boolean
                      nextCursor:
                        type: [string, 'null']
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /open-finance/v1/consents/{id}:
    delete:
      tags: [consents]
      summary: Revoke consent
      description: Revokes the specified consent. Subsequent calls using tokens for this consent fail with 403 consent_revoked.
      operationId: revokeConsent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Consent identifier
          schema:
            type: string
      responses:
        '204':
          description: Consent revoked successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /open-finance/v1/products/cdt:
    get:
      tags: [products]
      summary: Public CDT catalog
      description: Public list of available CDT products from Banco Demo. No user token required.
      operationId: getCdtProducts
      security: []
      responses:
        '200':
          description: List of CDT products.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CdtProduct'
        '400':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /oauth/par:
    post:
      tags: [oauth]
      summary: Pushed authorization request
      description: >-
        Creates a pending consent for the given entity and returns a request_uri. The consent has no
        customer yet. The customer is set when the person authorizes on the authorization page.
        The client authenticates with private_key_jwt. Errors are OAuth JSON errors, not problem+json.
      operationId: pushAuthorizationRequest
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - client_assertion_type
                - client_assertion
                - response_type
                - redirect_uri
                - scope
                - state
                - code_challenge
                - code_challenge_method
                - entity
              properties:
                client_id:
                  type: string
                  example: fynk-mobile
                client_assertion_type:
                  type: string
                  enum: ['urn:ietf:params:oauth:client-assertion-type:jwt-bearer']
                client_assertion:
                  type: string
                  description: JWT signed by the client (private_key_jwt).
                response_type:
                  type: string
                  enum: [code]
                redirect_uri:
                  type: string
                  example: 'fynk://bank/callback'
                scope:
                  type: string
                  example: 'accounts transactions'
                  description: Space separated scopes.
                state:
                  type: string
                code_challenge:
                  type: string
                  description: PKCE challenge.
                code_challenge_method:
                  type: string
                  enum: [S256]
                entity:
                  $ref: '#/components/schemas/ProviderId'
      responses:
        '201':
          description: Pending consent created.
          content:
            application/json:
              schema:
                type: object
                required: [request_uri, expires_in, consent_id]
                properties:
                  request_uri:
                    type: string
                    example: 'urn:ietf:params:oauth:request_uri:abc123'
                  expires_in:
                    type: integer
                    example: 300
                  consent_id:
                    type: string
                    example: 'consent-9f2c'
        '400':
          $ref: '#/components/responses/OAuthError'
        '401':
          $ref: '#/components/responses/OAuthInvalidClient'

  /oauth/token:
    post:
      tags: [oauth]
      summary: Token endpoint
      description: >-
        Supports three grants. authorization_code and refresh_token return a token set bound to a consent.
        client_credentials returns a token for the requested scope. The scope demo:provision is needed
        by the provisioning endpoint and is only granted to Fynk's client.
        The client authenticates with private_key_jwt. Errors are OAuth JSON errors, not problem+json.
      operationId: issueToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_assertion_type, client_assertion]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token, client_credentials]
                client_id:
                  type: string
                  example: fynk-mobile
                client_assertion_type:
                  type: string
                  enum: ['urn:ietf:params:oauth:client-assertion-type:jwt-bearer']
                client_assertion:
                  type: string
                  description: JWT signed by the client (private_key_jwt).
                code:
                  type: string
                  description: Authorization code. Required for authorization_code.
                code_verifier:
                  type: string
                  description: PKCE verifier. Required for authorization_code.
                redirect_uri:
                  type: string
                  example: 'fynk://bank/callback'
                  description: Required for authorization_code.
                refresh_token:
                  type: string
                  description: Required for refresh_token.
                scope:
                  type: string
                  example: 'demo:provision'
                  description: Used by client_credentials.
      responses:
        '200':
          description: Token set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/OAuthError'
        '401':
          $ref: '#/components/responses/OAuthInvalidClient'

  /oauth/authorize:
    get:
      tags: [oauth]
      summary: Authorization page
      description: >-
        Public listener only. Opens in the system browser. Without a banco-demo session it redirects to the
        banco-demo login (Keycloak), which offers "Ingresar con Fynk". With a session it shows the consent page,
        or a page saying the customer has no products at that entity. The consent page names the entity,
        the data, the receiver Fynk, the purpose and the term. "Autorizar" redirects to the redirect_uri
        with code and state. "Cancelar" redirects with error=access_denied.
      operationId: authorize
      security: []
      parameters:
        - name: request_uri
          in: query
          required: true
          description: The request_uri returned by the pushed authorization request.
          schema:
            type: string
        - name: client_id
          in: query
          required: true
          description: Client identifier used in the pushed authorization request.
          schema:
            type: string
      responses:
        '200':
          description: >-
            HTML page. Either the consent page, or the page "No tienes productos en <entidad>" when the
            customer has no accounts at that entity. In the second case no consent is created.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: >-
            Redirect. Without a session, to the banco-demo login. After the decision, to the redirect_uri
            (fynk://bank/callback) with code and state, or with error=access_denied.
          headers:
            Location:
              schema:
                type: string
        '400':
          description: Unknown or expired request_uri.
          content:
            text/html:
              schema:
                type: string

  /demo/v1/customers:
    post:
      tags: [demo]
      summary: Provision a demo customer
      description: >-
        Demo only. Internal mTLS listener only, a call without a client certificate or on the public listener
        gets 404. Creates the customer for the given customerRef if it does not exist, with accounts at
        Banco Demo and at least one more entity. The customerRef is the Fynk Keycloak sub, an opaque id,
        never an email or a cédula. It travels in the body, never in the URL. The call is idempotent: the same
        call returns the same answer.
      operationId: provisionCustomer
      security:
        - ClientCredentials: [demo:provision]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerRef]
              properties:
                customerRef:
                  type: string
                  minLength: 1
                  description: Fynk Keycloak sub. Opaque id.
      responses:
        '200':
          description: Entities where the customer has accounts.
          content:
            application/json:
              schema:
                type: object
                required: [entities]
                properties:
                  entities:
                    type: array
                    minItems: 2
                    items:
                      $ref: '#/components/schemas/SimulatedEntity'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by Keycloak realm banco-demo or static test token.
    ClientCredentials:
      type: oauth2
      description: >-
        Client credentials token for Fynk's client, authenticated with private_key_jwt.
        The internal listener also requires a client certificate (mTLS).
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            demo:provision: Create demo customers. Only granted to Fynk's client.

  responses:
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Access forbidden (e.g. consent revoked or expired).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded (60 req/min per consent).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OAuthError:
      description: OAuth error, for example invalid_request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    OAuthInvalidClient:
      description: Client authentication failed (invalid_client).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    Problem:
      description: Generic problem details response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    ProviderId:
      type: string
      enum: [banco-demo, billetera-demo, banco-digital-demo, cooperativa-demo]
      description: Simulated entity identifier.

    SimulatedEntity:
      type: object
      required: [providerId, displayName, kind, accountCount]
      properties:
        providerId:
          $ref: '#/components/schemas/ProviderId'
        displayName:
          type: string
          example: Banco Digital Demo
        kind:
          type: string
          enum: [bank, wallet]
        accountCount:
          type: integer
          minimum: 1
          example: 2

    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid_request
        error_description:
          type: string
          example: code_challenge and code_challenge_method=S256 are required

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 300
        refresh_token:
          type: string
          description: Returned for user grants only.
        scope:
          type: string
          example: 'accounts transactions'
        consent_id:
          type: string
          description: Returned for user grants (authorization_code, refresh_token).

    AccountType:
      type: string
      enum: [SAVINGS, WALLET, CREDIT_CARD, CDT]

    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, CLOSED]

    CdtDetails:
      type: object
      required: [rateEa, rateEaBps, termDays, opened, maturity]
      properties:
        rateEa:
          type: number
          example: 10.5
          description: Effective annual rate as a percentage (10.5 = 10.50% E.A.)
        rateEaBps:
          type: integer
          example: 1050
          description: Effective annual rate in basis points (1050 = 10.50%)
        termDays:
          type: integer
          example: 180
        opened:
          type: string
          format: date
          example: '2026-08-28'
        maturity:
          type: string
          format: date
          example: '2027-02-24'

    Account:
      type: object
      description: >-
        The API returns only the accounts of the consent's entity and customer.
        A token of another customer gets 403.
      required:
        - id
        - providerId
        - type
        - name
        - maskedNumber
        - currency
        - balance
        - available
        - simulated
      properties:
        id:
          type: string
          example: 'acc-ahorros-demo-01'
        providerId:
          $ref: '#/components/schemas/ProviderId'
        type:
          $ref: '#/components/schemas/AccountType'
        name:
          type: string
          example: 'Cuenta de Ahorros Demo'
        maskedNumber:
          type: string
          example: '****4821'
        currency:
          type: string
          example: 'COP'
        balance:
          type: string
          example: '3200000.00'
          description: Current balance as signed decimal string in COP
        balanceMinor:
          type: integer
          example: 320000000
          description: Current balance in COP centavos
        available:
          type: string
          example: '3200000.00'
          description: Available balance as signed decimal string in COP
        availableMinor:
          type: integer
          example: 320000000
        creditLimit:
          type: [string, 'null']
          example: '5000000.00'
        creditLimitMinor:
          type: [integer, 'null']
          example: 500000000
        paymentDueDate:
          type: [integer, 'null']
          example: 5
          description: Day of month for credit card payment
        status:
          $ref: '#/components/schemas/AccountStatus'
          default: ACTIVE
        cdt:
          $ref: '#/components/schemas/CdtDetails'
        simulated:
          type: boolean
          default: true
          description: Always true. Indicates data is generated by Banco Demo.

    TransactionStatus:
      type: string
      enum: [BOOKED, PENDING]

    Transaction:
      type: object
      description: >-
        The API returns only the transactions of accounts of the consent's entity and customer.
        A token of another customer gets 403.
      required:
        - id
        - providerId
        - accountId
        - bookingDateTime
        - amount
        - amountMinor
        - status
        - description
        - simulated
      properties:
        id:
          type: string
          example: 'tx-2026-10-30-salario'
        providerId:
          $ref: '#/components/schemas/ProviderId'
        accountId:
          type: string
          example: 'acc-ahorros-demo-01'
        bookingDateTime:
          type: string
          format: date-time
          example: '2026-10-30T08:00:00Z'
        amount:
          type: string
          example: '+5200000.00'
          description: Signed decimal amount (+ for deposit, - for expense)
        amountMinor:
          type: integer
          example: 520000000
          description: Signed integer amount in COP centavos
        status:
          $ref: '#/components/schemas/TransactionStatus'
        description:
          type: string
          example: 'NOMINA EMPRESA DEMO SAS'
        merchantName:
          type: [string, 'null']
          example: 'EMPRESA DEMO SAS'
        category:
          type: [string, 'null']
          example: 'salary'
        simulated:
          type: boolean
          default: true

    CdtProduct:
      type: object
      required:
        - id
        - name
        - termDays
        - rateEa
        - rateEaBps
        - minAmount
        - minAmountMinor
        - risk
      properties:
        id:
          type: string
          example: 'cdt-demo-180'
        name:
          type: string
          example: 'CDT Digital Banco Demo 180 Días'
        termDays:
          type: integer
          example: 180
        rateEa:
          type: number
          example: 10.5
        rateEaBps:
          type: integer
          example: 1050
        minAmount:
          type: string
          example: '500000.00'
        minAmountMinor:
          type: integer
          example: 50000000
        risk:
          type: string
          example: 'BAJO'

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: 'https://bancodemo.fynk.local/errors/consent-revoked'
        title:
          type: string
          example: 'Consent Revoked'
        status:
          type: integer
          example: 403
        detail:
          type: string
          example: 'The consent for this account access has been revoked.'
        code:
          type: string
          example: 'consent_revoked'
        instance:
          type: string
          example: '/open-finance/v1/accounts'
