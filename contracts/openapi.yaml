# Root of the Fynk API contract (owned by M0).
#
# This file holds only what every module shares: info, servers, the bearerAuth scheme,
# the Problem schema and common headers. Each backend module writes its own paths in
# contracts/modules/<module>.yaml and references the shared parts with
# '../openapi.yaml#/components/...'. A module never edits this file.
#
# `make generate` joins this file with every contracts/modules/*.yaml (Redocly `join`),
# lints the result and writes contracts/dist/openapi.json (gitignored).
openapi: 3.1.0
info:
  title: Fynk API
  version: 0.1.0
  description: |
    Backend API of Fynk. Every path lives under /v1.
    Errors use RFC 9457 problem details with a stable `code`.
    Personal data never travels in URLs or query strings; bank tokens travel only in request bodies.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080/v1
    description: Local API
  - url: http://localhost:4010
    description: Prism mock (make mock-api)
security:
  - bearerAuth: []
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token of the fynk realm, signed with PS256.
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: Id of the calling device, registered through POST /devices.
      schema:
        type: string
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Every POST that creates something accepts it. The same key returns the first result.
      schema:
        type: string
        maxLength: 128
  headers:
    RequestId:
      description: Request id, echoed from the request or generated by the API.
      schema:
        type: string
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details plus a stable machine-readable code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI reference that identifies the problem type, for example /problems/consent_revoked.
          examples: [/problems/not_implemented]
        title:
          type: string
          examples: [Not implemented]
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          examples: [501]
        detail:
          type: string
          description: Human readable explanation. Never contains personal data.
        instance:
          type: string
        code:
          type: string
          description: Stable code clients branch on, such as consent_revoked or not_implemented.
          examples: [not_implemented]
    ModuleHealth:
      type: object
      description: Example payload of the per-module health path. Modules remove it when they add real endpoints.
      required: [module, status]
      properties:
        module:
          type: string
          examples: [identity]
        status:
          type: string
          enum: [stub, ok]
  responses:
    Problem:
      description: Error, as RFC 9457 problem details.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/not_implemented
            title: Not implemented
            status: 501
            detail: This endpoint is not implemented yet.
            code: not_implemented
