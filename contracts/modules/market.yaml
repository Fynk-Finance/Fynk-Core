# Contract of the market module, owned by M15 (see CODEOWNERS).
# Only M15 edits this file. Shared parts come from ../openapi.yaml.
# The health path below is M0's example so generation works from day one.
# Replace it with the real endpoints of docs/modules/00-shared-contracts.md, section 5.
openapi: 3.1.0
info:
  title: Fynk API · Market
  version: 0.1.0
tags:
  - name: market
    description: 'CDT catalog, reference rate and quotes (M15).'
paths:
  /market/health:
    get:
      tags: [market]
      operationId: marketHealth
      summary: Example health path of the market module
      description: Public. Answers while the module is a stub. Removed when the module adds real endpoints.
      security: []
      responses:
        '200':
          description: The module is mounted.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ModuleHealth'
              example:
                module: market
                status: stub
        default:
          $ref: '../openapi.yaml#/components/responses/Problem'
