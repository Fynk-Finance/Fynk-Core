# Contract of the identity module, owned by M1 (see CODEOWNERS).
# Only M1 edits this file. Shared parts come from ../openapi.yaml.
openapi: 3.1.0
info:
  title: Fynk API · Identity
  version: 0.1.0
tags:
  - name: identity
    description: "Profile and linked devices (M1). Login and passwords are Keycloak's."
paths:
  /me:
    get:
      tags: [identity]
      operationId: getProfile
      summary: Get the profile of the signed-in person
      description: |
        Read from Keycloak and cached for 5 minutes. The email is masked: the app already knows it from the sign-in.
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
              example:
                id: 5b0f6c1e-3d2a-4f7b-9a41-2c8e7d6b5a10
                email: ca•••@correo.com
                firstName: Camila
                lastName: Rojas
                emailVerified: true
                createdAt: '2026-10-20T15:30:00Z'
                passwordUpdatedAt: '2026-10-20T15:32:10Z'
        '401':
          $ref: '../openapi.yaml#/components/responses/Problem'
        '404':
          description: The token is valid but the account no longer exists in Keycloak. The app signs out. Code `profile_not_found`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
              example:
                type: /problems/profile_not_found
                title: Profile not found
                status: 404
                code: profile_not_found
        '503':
          description: The profile service (Keycloak admin API) is not reachable. Retry later. Code `identity_admin_unavailable`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
              example:
                type: /problems/identity_admin_unavailable
                title: Profile service unavailable
                status: 503
                code: identity_admin_unavailable
        default:
          $ref: '../openapi.yaml#/components/responses/Problem'
    patch:
      tags: [identity]
      operationId: updateProfile
      summary: Change the first and last name
      description: Writes the names to Keycloak. At least one of them is required. The email is not editable here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProfileUpdate'
            example:
              firstName: Camila
              lastName: Rojas
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProfile'
        '400':
          description: A name is invalid. The detail names the field, never its value. Code `invalid_profile`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
              example:
                type: /problems/invalid_profile
                title: Invalid profile
                status: 400
                detail: The field firstName is invalid.
                code: invalid_profile
        '401':
          $ref: '../openapi.yaml#/components/responses/Problem'
        '404':
          description: The account no longer exists in Keycloak. Code `profile_not_found`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
        '503':
          description: The profile service (Keycloak admin API) is not reachable. Code `identity_admin_unavailable`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
        default:
          $ref: '../openapi.yaml#/components/responses/Problem'
  /devices:
    post:
      tags: [identity]
      operationId: registerDevice
      summary: Register the calling phone
      description: |
        The first device of a user is active. Later ones are pending until an active device approves them (M2).
        Registering the same public key, or repeating the same Idempotency-Key, returns the device already registered.
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityDeviceRegistration'
            example:
              name: iPhone de Camila
              platform: ios
              publicKey: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      responses:
        '201':
          description: The device was registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityDevice'
              example:
                id: 3f8b2a54-6a1e-4c58-9d3b-7a1f0c2e9b11
                name: iPhone de Camila
                platform: ios
                status: active
                current: false
                createdAt: '2026-10-27T14:03:11Z'
                lastSeenAt: '2026-10-27T14:03:11Z'
        '200':
          description: The same key or Idempotency-Key had already registered this device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityDevice'
        '400':
          description: A field is invalid. The detail names the field, never its value. Code `invalid_device`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
              example:
                type: /problems/invalid_device
                title: Invalid device
                status: 400
                detail: The field publicKey is invalid.
                code: invalid_device
        '409':
          description: The public key belongs to a removed device. The phone must make a new key pair. Code `device_key_removed`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
              example:
                type: /problems/device_key_removed
                title: Device key removed
                status: 409
                detail: This device was removed. Create a new key pair and register again.
                code: device_key_removed
        default:
          $ref: '../openapi.yaml#/components/responses/Problem'
    get:
      tags: [identity]
      operationId: listDevices
      summary: List the linked devices
      description: Active and pending devices, the most recently seen first. `current` is true for the device in X-Device-Id.
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/DeviceId'
      responses:
        '200':
          description: The devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityDeviceList'
              example:
                items:
                  - id: 3f8b2a54-6a1e-4c58-9d3b-7a1f0c2e9b11
                    name: iPhone de Camila
                    platform: ios
                    status: active
                    current: true
                    createdAt: '2026-10-27T14:03:11Z'
                    lastSeenAt: '2026-10-27T14:20:45Z'
                  - id: 9c1d7e02-52b4-4f0a-8e6d-1b3a5c7d9e22
                    name: Pixel de Camila
                    platform: android
                    status: pending
                    current: false
                    createdAt: '2026-10-27T14:10:00Z'
                    lastSeenAt: '2026-10-27T14:10:00Z'
        '401':
          $ref: '../openapi.yaml#/components/responses/Problem'
        default:
          $ref: '../openapi.yaml#/components/responses/Problem'
  /devices/current:
    get:
      tags: [identity]
      operationId: getCurrentDevice
      summary: Get the calling device
      description: The app calls it on every start to learn whether this device was removed. It updates the last seen time.
      parameters:
        - name: X-Device-Id
          in: header
          required: true
          description: Id of the calling device, registered through POST /devices.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: The device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityDevice'
              example:
                id: 3f8b2a54-6a1e-4c58-9d3b-7a1f0c2e9b11
                name: iPhone de Camila
                platform: ios
                status: active
                current: true
                createdAt: '2026-10-27T14:03:11Z'
                lastSeenAt: '2026-10-27T14:20:45Z'
        '404':
          description: The device does not exist. Code `device_not_found`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
              example:
                type: /problems/device_not_found
                title: Device not found
                status: 404
                code: device_not_found
        '410':
          description: The device was removed. Code `device_removed`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
              example:
                type: /problems/device_removed
                title: Device removed
                status: 410
                code: device_removed
        default:
          $ref: '../openapi.yaml#/components/responses/Problem'
  /devices/sign-out-others:
    post:
      tags: [identity]
      operationId: signOutOtherDevices
      summary: Remove every device except the calling one
      parameters:
        - name: X-Device-Id
          in: header
          required: true
          description: Id of the calling device. It stays linked.
          schema:
            type: string
            maxLength: 64
      responses:
        '204':
          description: The other devices were removed.
        '404':
          description: The calling device does not exist. Code `device_not_found`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
        '410':
          description: The calling device was removed. Code `device_removed`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
        default:
          $ref: '../openapi.yaml#/components/responses/Problem'
  /devices/{deviceId}:
    delete:
      tags: [identity]
      operationId: removeDevice
      summary: Remove a device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The device was removed (also when it already was).
        '404':
          description: The device does not exist or belongs to another user. Code `device_not_found`.
          content:
            application/problem+json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/Problem'
              example:
                type: /problems/device_not_found
                title: Device not found
                status: 404
                code: device_not_found
        default:
          $ref: '../openapi.yaml#/components/responses/Problem'
components:
  schemas:
    IdentityProfile:
      type: object
      required: [id, email, emailVerified, createdAt]
      properties:
        id:
          type: string
          description: The Keycloak subject of the person.
        email:
          type: string
          description: The email, masked (`ca•••@correo.com`). The full address never leaves Keycloak through this API.
        firstName:
          type: string
        lastName:
          type: string
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        passwordUpdatedAt:
          type: string
          format: date-time
          description: When the password was last set. Absent when unknown.
    IdentityProfileUpdate:
      type: object
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          description: Letters, spaces, apostrophes, hyphens and periods.
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          description: Letters, spaces, apostrophes, hyphens and periods.
    IdentityDeviceRegistration:
      type: object
      required: [name, platform, publicKey]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Name the person sees in the list of devices.
        platform:
          type: string
          enum: [ios, android]
        publicKey:
          type: string
          description: X25519 public key, 32 bytes in standard base64 with padding.
          examples: [AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=]
    IdentityDevice:
      type: object
      required: [id, name, platform, status, current, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
          enum: [ios, android]
        status:
          type: string
          enum: [active, pending]
        current:
          type: boolean
          description: True when this is the device in the X-Device-Id header of the call.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    IdentityDeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdentityDevice'
