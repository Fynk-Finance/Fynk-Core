# Contract of the backup module, owned by M2 (see CODEOWNERS).
# Only M2 edits this file. Shared parts come from ../openapi.yaml.
# The health path below is M0's example so generation works from day one.
# Replace it with the real endpoints of docs/modules/00-shared-contracts.md, section 5.
openapi: 3.1.0
info:
  title: Fynk API · Backup
  version: 0.1.0
tags:
  - name: backup
    description: 'Encrypted backup records, recovery key and device approvals (M2).'
paths:
  /backup/health:
    get:
      tags: [backup]
      operationId: backupHealth
      summary: Example health path of the backup module
      description: Public. Answers while the module is a stub. Removed when the module adds real endpoints.
      security: []
      responses:
        '200':
          description: The module is mounted.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ModuleHealth'
              example:
                module: backup
                status: stub
        default:
          $ref: '../openapi.yaml#/components/responses/Problem'
