# Contract of the bank module, owned by M5 (see CODEOWNERS).
# Only M5 edits this file. Shared parts come from ../openapi.yaml.
# The health path below is M0's example so generation works from day one.
# Replace it with the real endpoints of docs/modules/00-shared-contracts.md, section 5.
openapi: 3.1.0
info:
  title: Fynk API · Bank
  version: 0.1.0
tags:
  - name: bank
    description: 'Bank providers, authorization and the bank proxy (M5).'
paths:
  /bank/health:
    get:
      tags: [bank]
      operationId: bankHealth
      summary: Example health path of the bank module
      description: Public. Answers while the module is a stub. Removed when the module adds real endpoints.
      security: []
      responses:
        '200':
          description: The module is mounted.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ModuleHealth'
              example:
                module: bank
                status: stub
        default:
          $ref: '../openapi.yaml#/components/responses/Problem'
