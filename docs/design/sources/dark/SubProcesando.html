<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>App azul y verde · Oscuro · Suscripción · Procesando pago</title></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;background:#13212d;color:#e8f1f6}
a{color:#62c8f0}
.vscroll{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;overflow-x:hidden;overflow-y:auto}
.vscroll::-webkit-scrollbar{display:none;width:0;height:0}
.btn{cursor:pointer;transition:background-color .2s ease,transform .2s ease}
.btn:hover{transform:translateY(-1px)}
.cta{cursor:pointer;transition:background-color .2s ease}
.cta:hover{background-color:#279dcc !important}
.cta-lime:hover{background-color:#93cc26 !important}
.cta:hover .cta-arrow{transform:translateX(4px)}
.cta-arrow{transition:transform .25s ease}
.opt{cursor:pointer;transition:border-color .2s ease,background-color .2s ease}
.opt:hover{border-color:#2b5267 !important}
.btn:focus-visible,.cta:focus-visible,.link:focus-visible,.opt:focus-visible{outline:3px solid #b5e5f7;outline-offset:2px}
@keyframes sb-shine{0%,62%{transform:translateX(0)}86%,100%{transform:translateX(620px)}}
.shine{animation:sb-shine 8s ease-in-out infinite 1.5s}
@keyframes sb-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sb-float2{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes sb-tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes sb-spin{to{transform:rotate(360deg)}}
@keyframes sb-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes sb-pop{0%{transform:scale(0) rotate(-14deg)}60%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes sb-burst{0%{opacity:0;transform:translate(0,0) scale(.2)}15%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(var(--sc)) rotate(var(--r))}}
@keyframes sb-sheet{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes sb-pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.18);opacity:0}}
.fl1{animation:sb-float 5s ease-in-out infinite}
.fl2{animation:sb-float2 6s ease-in-out infinite .6s}
.fl3{animation:sb-float 4.4s ease-in-out infinite 1.2s}
.tw{transform-box:fill-box;transform-origin:center;animation:sb-tw 2.6s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:sb-spin 40s linear infinite}
.spin-fast{transform-origin:center;animation:sb-spin 1.1s linear infinite}
.rise{animation:sb-rise .5s ease-out both .1s}
.pop{animation:sb-pop .6s cubic-bezier(.34,1.56,.64,1) both .1s}
.bit{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);animation:sb-burst var(--du) cubic-bezier(.15,.7,.3,1) both var(--d)}
.sheet-up{animation:sb-sheet .55s cubic-bezier(.22,1,.36,1) both .9s}
.pulse{transform-origin:center;animation:sb-pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.shine,.fl1,.fl2,.fl3,.tw,.spin,.spin-fast,.rise,.pop,.sheet-up,.pulse{animation:none}.bit{display:none}}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #0b1620; position: relative; overflow: hidden">
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; top: 0; left: 0">
<rect opacity="0.4" x="236" y="-80" width="230" height="230" rx="52" fill="#3ab3e3"></rect>
<rect opacity="0.4" x="-70" y="610" width="190" height="190" rx="44" fill="#279dcc"></rect>
<g class="shine"><rect x="-140" y="-40" width="56" height="920" fill="#ffffff" fill-opacity=".12" transform="skewX(-18)"></rect></g>
</svg>
<div class="rise" style="position: relative; height: 844px; box-sizing: border-box; padding: 152px 24px 40px; display: flex; flex-direction: column; align-items: center; color: #ffffff; text-align: center">
<div style="position: relative; width: 132px; height: 132px; display: flex; align-items: center; justify-content: center">
<span class="pulse" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 40px; background-color: #13212d; opacity: 0"></span>
<svg class="spin-fast" width="132" height="132" viewBox="0 0 132 132" aria-hidden="true" style="position: absolute; inset: 0; animation-duration: 1.6s"><circle cx="66" cy="66" r="60" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="4"></circle><path d="M126 66a60 60 0 0 0-60-60" fill="none" stroke="#a8e03a" stroke-width="4" stroke-linecap="round"></path></svg>
<span style="position: relative; width: 88px; height: 88px; border-radius: 26px; background-color: #13212d; color: #2fa8d8; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></span>
</div>
<h1 role="status" style="margin: 32px 0 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; line-height: 32px; letter-spacing: -0.01em">Estamos confirmando tu pago</h1>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 22px; font-weight: 500; opacity: .92">Esto puede tardar unos segundos.</p>
<ol style="list-style: none; margin: 32px 0 0; padding: 16px 16px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; border-radius: 20px; background-color: #0F223326; text-align: left">
<li style="display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 20px; font-weight: 600; color: #ffffff"><span style="width: 24px; height: 24px; border-radius: 9px; background-color: #a8e03a; color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 6 9 17l-5-5"></path></svg></span>Pago iniciado en la pasarela segura</li>
<li style="display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 20px; font-weight: 600; color: #ffffff"><span style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="spin-fast" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="3"></circle><path d="M21 12a9 9 0 0 0-9-9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></path></svg></span>Esperando confirmación de tu banco</li>
<li style="display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 20px; font-weight: 600; color: rgba(255, 255, 255, 0.65)"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 9px; border: 2px solid rgba(255, 255, 255, 0.35); flex-shrink: 0"></span>Activando Fynk Plus</li>
</ol>
<p style="margin: auto 0 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 19px; text-align: left; opacity: .92"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"></path></svg><span>No cierres la app ni vuelvas atrás. Si sales, te avisaremos cuando el pago se confirme.</span></p>
</div>
</div>
</body></html>
