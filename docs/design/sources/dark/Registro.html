<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>App azul y verde · Oscuro · Crear cuenta</title></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;background:#13212d;color:#e8f1f6}
a{color:#b6e45a}a:hover{color:#b6e45a}
.field{transition:border-color .2s ease,background-color .2s ease}
.field:focus-within{border-color:#2fa8d8 !important;background-color:#13212d !important}
.field input{border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;color:#e8f1f6;flex-grow:1;min-width:0;height:100%}
.field input::placeholder{color:#71889a}
.eye{cursor:pointer;border:none;background:none;padding:0;color:#97abb8;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px}
.eye:hover{background-color:#1a3444}
.eye:focus-visible,.cta:focus-visible,.link:focus-visible{outline:3px solid #b5e5f7;outline-offset:2px}
.cta{cursor:pointer;transition:background-color .2s ease,transform .2s ease}
.cta:hover{background-color:#93cc26 !important}
.cta:hover .cta-arrow{transform:translateX(4px)}
.cta-arrow{transition:transform .25s ease}
@keyframes lg-shine{0%,62%{transform:translateX(0)}86%,100%{transform:translateX(620px)}}
.shine{animation:lg-shine 8s ease-in-out infinite 1.5s}
@keyframes lg-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.sheet{animation:lg-rise .6s ease-out both .1s}
@media (prefers-reduced-motion:reduce){.shine,.sheet{animation:none}}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #0b1620; position: relative; overflow: hidden">
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; top: 0; left: 0">
<rect opacity="0.4" x="226" y="-86" width="230" height="230" rx="52" fill="#3ab3e3"></rect>
<rect opacity="0.4" x="296" y="-30" width="116" height="116" rx="28" fill="#47b6e2"></rect>
<rect opacity="0.4" x="-70" y="196" width="170" height="170" rx="40" fill="#279dcc"></rect>
<rect opacity="0.4" x="40" y="150" width="58" height="58" rx="16" fill="#3ab3e3"></rect>
<rect opacity="0.4" x="300" y="236" width="74" height="74" rx="20" fill="#279dcc"></rect>
<g class="shine"><rect x="-140" y="-40" width="56" height="460" fill="#ffffff" fill-opacity=".12" transform="skewX(-18)"></rect></g>
</svg>

<div style="position: relative; padding: 48px 24px 0; display: flex; flex-direction: column; gap: 24px; color: #ffffff">
<div role="img" aria-label="Fynk" style="display: flex; align-items: center; gap: 8px">
<svg width="34" height="42" viewBox="80 20 510 640" aria-hidden="true" style="flex-shrink: 0; display: block"><g transform="matrix(1,-0.16,0,1,0,0)" fill="#ffffff"><path d="M130,126 H540 Q570,126 570,156 V230 Q570,252 548,252 H262 Q240,252 240,274 V383 Q240,405 262,405 H548 Q570,405 570,427 V531 Q570,561 540,561 H130 Q100,561 100,531 V156 Q100,126 130,126 Z"></path><rect x="262" y="268" width="120" height="120" rx="38"></rect><path d="M152,588 H345 V680 Q345,696 330,689 Z"></path></g></svg>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; line-height: 32px; letter-spacing: -0.01em">Fynk</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 34px; line-height: 40px; letter-spacing: -0.02em">Crea tu cuenta</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Tu primer paso hacia tus metas empieza aquí.</p>
</div>
</div>

<div class="sheet" aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 645px; background-color: #a8e03a; box-shadow: 0 -12px 30px -20px rgba(0, 0, 0, 0.35); border-top-left-radius: 24px; border-top-right-radius: 24px; border-bottom-right-radius: 0px; border-bottom-left-radius: 0px"></div>
<form class="sheet" aria-label="Crear cuenta" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 631px; box-sizing: border-box; margin: 0; background-color: #13212d; border-radius: 32px 32px 0 0; box-shadow: 0 -12px 30px -20px rgba(0, 0, 0, 0.45); padding: 32px 24px 32px; display: flex; flex-direction: column; gap: 0px">
<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; line-height: 34px; letter-spacing: -0.01em">Regístrate</h2>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #97abb8">Solo necesitas tres datos para empezar.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px">
<label for="reg-id" style="font-size: 14px; line-height: 20px; font-weight: 600">Cédula</label>
<div class="field" style="display: flex; align-items: center; gap: 8px; height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #223746; background-color: #182a37">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#62c8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16a3 3 0 0 1 6 0"></path><path d="M15 10h3"></path><path d="M15 14h3"></path></svg>
<input id="reg-id" type="text" inputmode="numeric" autocomplete="off" placeholder="Número de documento">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px">
<label for="reg-email" style="font-size: 14px; line-height: 20px; font-weight: 600">Correo electrónico</label>
<div class="field" style="display: flex; align-items: center; gap: 8px; height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #223746; background-color: #182a37">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#62c8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 4h16v16H4z"></path><path d="m4 7 8 6 8-6"></path></svg>
<input id="reg-email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px">
<label for="reg-pass" style="font-size: 14px; line-height: 20px; font-weight: 600">Contraseña</label>
<div class="field" style="display: flex; align-items: center; gap: 8px; height: 56px; box-sizing: border-box; padding: 0 8px 0 16px; border-radius: 14px; border: 1.5px solid #223746; background-color: #182a37">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#62c8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<input id="reg-pass" type="password" autocomplete="new-password" placeholder="Crea una contraseña">
<button class="eye" type="button" aria-label="Mostrar contraseña" aria-pressed="false" onClick="">

<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: #97abb8">Mínimo 8 caracteres, con una letra y un número.</p>
</div>

<a class="cta" href="OnbIntro.html" style="margin-top: 0px; box-sizing: border-box; text-decoration: none; height: 56px; width: 100%; border-radius: 16px; background-color: #2fa8d8; color: #ffffff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; margin-bottom: 16px">
<span>Crear cuenta</span>
<svg class="cta-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a><label for="reg-terms" style="display: flex; align-items: flex-start; gap: 8px; margin-bottom: 24px; cursor: pointer; font-size: 13px; line-height: 20px; color: #97abb8">
<input id="reg-terms" type="checkbox" required="" style="flex-shrink: 0; width: 24px; height: 24px; margin: 0; accent-color: #2fa8d8; cursor: pointer">
<span>Acepto los <a class="link" href="#" style="font-weight: 700; text-decoration: none; color: #62c8f0">Términos y condiciones</a> y la <a class="link" href="#" style="font-weight: 700; text-decoration: none; color: #62c8f0">Política de privacidad</a>.</span>
</label>



<p style="margin: auto 0 0; text-align: center; font-size: 14px; line-height: 20px; color: #97abb8">¿Ya tienes cuenta? <a class="link" href="Login.html" style="font-weight: 700; text-decoration: none">Inicia sesión</a></p>
</form>
</div>
</body></html>
