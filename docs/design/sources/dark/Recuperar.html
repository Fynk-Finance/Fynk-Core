<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>App azul y verde · Oscuro · Recuperar contraseña</title></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;background:#13212d;color:#e8f1f6}
a{color:#b6e45a}a:hover{color:#b6e45a}
.field{transition:border-color .2s ease,background-color .2s ease}
.field:focus-within{border-color:#2fa8d8 !important;background-color:#13212d !important}
.field input{border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;color:#e8f1f6;flex-grow:1;min-width:0;height:100%}
.field input::placeholder{color:#71889a}
.eye{cursor:pointer;border:none;background:none;padding:0;color:#97abb8;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px}
.eye:hover{background-color:#1a3444}
.eye:focus-visible,.cta:focus-visible,.link:focus-visible{outline:3px solid #b5e5f7;outline-offset:2px}
.cta{cursor:pointer;transition:background-color .2s ease,transform .2s ease}
.cta:hover{background-color:#93cc26 !important}
.cta:hover .cta-arrow{transform:translateX(4px)}
.cta-arrow{transition:transform .25s ease}
.back{cursor:pointer;transition:background-color .2s ease}
.back:hover{background-color:rgba(255,255,255,.3) !important}
.back:focus-visible{outline:3px solid #13212d;outline-offset:2px}
@keyframes rc-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.step{animation:rc-in .35s ease-out both}
@media (prefers-reduced-motion:reduce){.step{animation:none}}
@keyframes lg-shine{0%,62%{transform:translateX(0)}86%,100%{transform:translateX(620px)}}
.shine{animation:lg-shine 8s ease-in-out infinite 1.5s}
@keyframes lg-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.sheet{animation:lg-rise .6s ease-out both .1s}
@media (prefers-reduced-motion:reduce){.shine,.sheet{animation:none}}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #0b1620; position: relative; overflow: hidden">
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; top: 0; left: 0">
<rect opacity="0.4" x="226" y="-86" width="230" height="230" rx="52" fill="#3ab3e3"></rect>
<rect opacity="0.4" x="296" y="-30" width="116" height="116" rx="28" fill="#47b6e2"></rect>

<rect opacity="0.4" x="40" y="150" width="58" height="58" rx="16" fill="#3ab3e3"></rect>
<rect opacity="0.4" x="300" y="236" width="74" height="74" rx="20" fill="#279dcc"></rect>
<g class="shine"><rect x="-140" y="-40" width="56" height="460" fill="#ffffff" fill-opacity=".12" transform="skewX(-18)"></rect></g>
</svg>

<div style="position: relative; padding: 16px 24px 0; display: flex; flex-direction: column; color: #ffffff">
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<a class="back" href="Login.html" aria-label="Volver a iniciar sesión" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 14px; background-color: rgba(255, 255, 255, 0.2); color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>


<div role="img" aria-label="Fynk" style="display: flex; align-items: center; gap: 8px"><svg width="24" height="30" viewBox="80 20 510 640" aria-hidden="true" style="flex-shrink: 0; display: block"><g transform="matrix(1,-0.16,0,1,0,0)" fill="#ffffff"><path d="M130,126 H540 Q570,126 570,156 V230 Q570,252 548,252 H262 Q240,252 240,274 V383 Q240,405 262,405 H548 Q570,405 570,427 V531 Q570,561 540,561 H130 Q100,561 100,531 V156 Q100,126 130,126 Z"></path><rect x="262" y="268" width="120" height="120" rx="38"></rect><path d="M152,588 H345 V680 Q345,696 330,689 Z"></path></g></svg><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; line-height: 26px">Fynk</span></div>
<span aria-hidden="true" style="width: 48px"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 32px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px; line-height: 38px; letter-spacing: -0.02em">¿Olvidaste tu clave?</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 500; opacity: 0.92">Tranquilo, te ayudamos a recuperarla.</p>
</div>
</div>

<div class="sheet" aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 645px; background-color: #a8e03a; box-shadow: 0 -12px 30px -20px rgba(0, 0, 0, 0.35); border-radius: 24px 24px 0 0"></div>
<div class="sheet" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 631px; box-sizing: border-box; background-color: #13212d; border-radius: 32px 32px 0 0; box-shadow: 0 -12px 30px -20px rgba(0, 0, 0, 0.45); padding: 32px 24px 32px; display: flex; flex-direction: column">
<div role="progressbar" aria-label="Paso 1 de 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" style="display: flex; gap: 8px; margin-bottom: 24px"><span style="height: 6px; width: 28px; border-radius: 999px; background-color: #2fa8d8; transition: width .25s ease, background-color .25s ease"></span><span style="height: 6px; width: 14px; border-radius: 999px; background-color: #22313d; transition: width .25s ease, background-color .25s ease"></span><span style="height: 6px; width: 14px; border-radius: 999px; background-color: #22313d; transition: width .25s ease, background-color .25s ease"></span></div>


<div class="step" style="display: flex; flex-direction: column; flex-grow: 1">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; line-height: 32px; letter-spacing: -0.01em">Recupera tu acceso</h2>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #97abb8; margin-top: 8px">Escribe el correo de tu cuenta y te enviaremos un código para crear una nueva contraseña.</p>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 24px">
<label for="rc-email" style="font-size: 14px; line-height: 20px; font-weight: 600">Correo electrónico</label>
<div class="field" style="display: flex; align-items: center; gap: 8px; height: 56px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #223746; background-color: #182a37; padding: 0 16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#62c8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 4h16v16H4z"></path><path d="m4 7 8 6 8-6"></path></svg><input id="rc-email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" value="laura.gomez@correo.com"></div>
</div>
<div style="display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; padding: 8px 16px; border-radius: 14px; background-color: #182a37; font-size: 12px; line-height: 18px; color: #97abb8"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#62c8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><span>Por seguridad, el código vence en 10 minutos.</span></div>
<button class="cta" type="button" onClick="" style="margin-top: auto; box-sizing: border-box; text-decoration: none; height: 56px; width: 100%; border: none; border-radius: 16px; background-color: #2fa8d8; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0"><span>Enviar código</span><svg class="cta-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
<a class="link" href="Login.html" style="align-self: center; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; font-size: 14px; line-height: 20px; font-weight: 700; text-decoration: none; color: #62c8f0; margin-top: 16px">Volver a iniciar sesión</a>
</div>







</div>
</div>
</body></html>
