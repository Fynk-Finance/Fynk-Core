<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>App azul y verde · Mi cuenta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;background:#ffffff;color:#0f2233}
a{color:#6a9e12}a:hover{color:#5a8a0c}
.hscroll{scrollbar-width:none;-ms-overflow-style:none;scroll-snap-type:x mandatory;overflow-x:auto;overflow-y:hidden}
.hscroll::-webkit-scrollbar{display:none;width:0;height:0}
.vscroll{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;overflow-x:hidden;overflow-y:auto}
.vscroll::-webkit-scrollbar{display:none;width:0;height:0}
.btn{cursor:pointer;transition:background-color .2s ease,transform .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.nav-item:focus-visible,.card-link:focus-visible,.chip:focus-visible{outline:3px solid #dcf5a8;outline-offset:2px}
.row{transition:background-color .15s ease}
.row:hover{background-color:#f4fbfe !important}
.card-link{transition:transform .2s ease,box-shadow .2s ease}
.card-link:hover{transform:translateY(-2px)}
.card-link:hover .go{transform:translateX(3px)}
.go{transition:transform .2s ease}
.chip{cursor:pointer}
.nav-item{cursor:pointer;transition:color .2s ease}
.nav-item:not([aria-current]):hover{color:#ffffff !important}
@keyframes vd-shine{0%,62%{transform:translateX(0)}86%,100%{transform:translateX(520px)}}
.shine{animation:vd-shine 7s ease-in-out infinite 1.5s}
@media (prefers-reduced-motion:reduce){.shine{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #ffffff; position: relative; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 257px; background-color: #2fa8d8; border-radius: 0 0 24px 24px; box-shadow: 0 10px 24px -18px rgba(15, 34, 51, 0.35); z-index: 0; overflow: hidden"><svg width="390" height="257" viewBox="0 0 390 257" aria-hidden="true" style="position: absolute; top: 0; left: 0; z-index: 0">
<rect x="268" y="-70" width="190" height="190" rx="44" fill="#3ab3e3"></rect>
<rect x="320" y="-26" width="96" height="96" rx="24" fill="#47b6e2"></rect>
<rect x="-56" y="150" width="140" height="140" rx="34" fill="#279dcc"></rect>
<g class="shine"><rect x="-120" y="-40" width="46" height="340" fill="#ffffff" fill-opacity=".12" transform="skewX(-18)"></rect></g>
</svg><div style="position: relative; z-index: 1; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px; color: #ffffff; height: 236px">
<header style="display: flex; align-items: center; justify-content: space-between; min-height: 48px">
<a class="btn" href="VerdeDashboard.dc.html" aria-label="Volver al dashboard" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; background-color: rgba(255, 255, 255, 0.2); color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<div data-dc-group="" style="box-sizing: border-box; display: flex; flex-direction: row; gap: normal; align-items: center; width: 100%; justify-content: center"><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; line-height: 22px">Mi cuenta</h1></div>
<span aria-hidden="true" style="width: 44px; flex-shrink: 0"></span>
</header>
<div style="display: flex; justify-content: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; text-align: center">
<span style="width: 88px; height: 88px; border-radius: 999px; background-color: #ffffff; color: #2fa8d8; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px; flex-shrink: 0; box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.28)">LG</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; line-height: 24px; white-space: nowrap">Laura Gómez</span>
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 14px; font-weight: 700; padding: 3px 9px 3px 6px; border-radius: 999px; background-color: #a8e03a; color: #ffffff"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Perfil verificado</span>
</div>
</div>

</div>
</div></div>


<div style="position: absolute; left: 0; top: 258px; width: 390px; height: 586px; box-sizing: border-box; background-color: #ffffff; overflow: hidden">
<div class="vscroll" style="height: 586px; box-sizing: border-box; padding: 22px 20px 32px; display: flex; flex-direction: column; gap: 18px">
<section style="display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; line-height: 26px">Mis tarjetas</h2>
<span style="font-size: 12px; font-weight: 600; color: #5e7482">4 conectadas</span>
</div>
<div class="hscroll" style="display: flex; gap: 12px; margin: 0 -20px -14px; padding: 2px 20px 20px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
<a class="card-link" href="#" aria-label="Ver tarjeta {{c.name}}" style="flex-shrink: 0; width: 262px; height: 162px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-radius: 20px; background-color: #50c1eb; position: relative; overflow: hidden; text-decoration: none; color: #ffffff; box-shadow: 0 14px 26px -16px rgba(80, 193, 235, 0.9); scroll-snap-align: start">
<svg width="262" height="162" viewBox="0 0 262 162" aria-hidden="true" style="position: absolute; top: 0; left: 0">
<rect x="150" y="-70" width="150" height="150" rx="36" fill="#6bccef"></rect>
<rect x="196" y="-30" width="84" height="84" rx="20" fill="#86d6f3"></rect>
<rect x="-40" y="116" width="96" height="96" rx="24" fill="#47b6e2"></rect>
<g class="shine"><rect x="-110" y="-40" width="36" height="260" fill="#ffffff" fill-opacity=".18" transform="skewX(-18)"></rect></g>
</svg>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 30px; height: 30px; border-radius: 9px; background-color: #ffffff; color: #50c1eb; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px">{{c.initials}}</span><span style="font-size: 13px; line-height: 17px; font-weight: 700">{{c.name}}</span></span>
<span style="font-size: 10px; line-height: 13px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background-color: {{c.chipBg}}; color: #ffffff">{{c.status}}</span>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; line-height: 14px; opacity: 0.92">{{c.balanceLabel}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em">{{c.balance}}</span>
</div>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between; font-size: 12px; line-height: 16px; opacity: 0.95">
<span style="font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.08em">{{c.number}}</span><span>{{c.type}}</span>
</div>
</a>
</sc-for>
<a class="card-link" href="VerdeConectarBanco.dc.html" style="flex-shrink: 0; width: 262px; height: 162px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 20px; border: 1.5px dashed #a8e03a; background-color: #f8fdee; color: #6a9e12; text-decoration: none; scroll-snap-align: start">
<span style="width: 44px; height: 44px; border-radius: 14px; background-color: #a8e03a; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="font-size: 15px; line-height: 20px; font-weight: 700">Conectar otra tarjeta</span>
</a>
</div>
</section>
<section aria-label="Datos personales" style="display: flex; flex-direction: column; gap: 14px; padding: 6px 16px; border-radius: 20px; flex-shrink: 0; background-color: #ffffff; border: 1px solid #e4f5fc; box-shadow: 0 6px 16px -12px rgba(15, 34, 51, 0.2)">
<div style="display: flex; flex-direction: column; margin-top: -1px; clip-path: inset(1px 0 0 0)">
<sc-for list="{{info}}" as="i" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid #edf1f4; padding-top: 8px; padding-bottom: 8px">
<span style="width: 32px; height: 32px; border-radius: 10px; background-color: #e4f5fc; color: #1f93c2; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 11px; line-height: 14px; color: #5e7482">{{i.label}}</span>
<span style="font-size: 14px; line-height: 19px; font-weight: 600">{{i.value}}</span>
</div>
</div>
</sc-for>
</div>
</section>


<section aria-label="Gestión de cuenta" style="display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; line-height: 26px">Gestión de cuenta</h2>
<div style="display: flex; flex-direction: column; padding: 4px 8px; border-radius: 20px; background-color: #ffffff; border: 1px solid #e4f5fc; box-shadow: 0 6px 16px -12px rgba(15, 34, 51, 0.2)">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
<a class="row" href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 14px; text-decoration: none; color: #0f2233">
<span style="width: 36px; height: 36px; border-radius: 11px; background-color: #e4f5fc; color: #1f93c2; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 14px; line-height: 19px; font-weight: 600">{{o.title}}</span><span style="font-size: 12px; line-height: 16px; color: #5e7482">{{o.desc}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a9ba6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</sc-for>
</div>
</section>
<button class="btn" type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; width: 100%; box-sizing: border-box; border-radius: 16px; border: 1.5px solid #f3c7c7; background-color: #fff5f5; color: #c0392b; font-family: inherit; font-size: 15px; font-weight: 700; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>Eliminar cuenta</button>
</div>
</div>

</div>
</x-dc>

</body>
</html>
