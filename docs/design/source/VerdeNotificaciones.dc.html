<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>App azul y verde · Notificaciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;background:#ffffff;color:#0f2233}
a{color:#6a9e12}a:hover{color:#5a8a0c}
.hscroll{scrollbar-width:none;-ms-overflow-style:none;scroll-snap-type:x mandatory;overflow-x:auto;overflow-y:hidden}
.hscroll::-webkit-scrollbar{display:none;width:0;height:0}
.vscroll{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;overflow-x:hidden;overflow-y:auto}
.vscroll::-webkit-scrollbar{display:none;width:0;height:0}
.btn{cursor:pointer;transition:background-color .2s ease,transform .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.nav-item:focus-visible,.card-link:focus-visible,.chip:focus-visible{outline:3px solid #dcf5a8;outline-offset:2px}
.row{transition:background-color .15s ease}
.row:hover{background-color:#f4fbfe !important}
.card-link{transition:transform .2s ease,box-shadow .2s ease}
.card-link:hover{transform:translateY(-2px)}
.card-link:hover .go{transform:translateX(3px)}
.go{transition:transform .2s ease}
.chip{cursor:pointer}
.nav-item{cursor:pointer;transition:color .2s ease}
.nav-item:not([aria-current]):hover{color:#ffffff !important}
@keyframes vd-shine{0%,62%{transform:translateX(0)}86%,100%{transform:translateX(520px)}}
.shine{animation:vd-shine 7s ease-in-out infinite 1.5s}
@media (prefers-reduced-motion:reduce){.shine{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #ffffff; position: relative; overflow: hidden">
<div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px; color: #0f2233">
<header style="display: flex; align-items: center; justify-content: space-between; min-height: 48px">
<a class="btn" href="VerdeDashboard.dc.html" aria-label="Volver al dashboard" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; color: #1f93c2; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 35px; height: 35px"><path d="m15 18-6-6 6-6"></path></svg></a>

</header>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px; width: 100%">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; line-height: 32px">Notificaciones</h1>
<div data-dc-group="" style="box-sizing: border-box; display: flex; flex-direction: row; gap: 4px; justify-content: space-between; align-items: normal; width: 100%; height: 19px"><span style="font-size: 13px; line-height: 18px; color: #5e7482">3 sin leer</span><a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none">Marcar como leídas</a></div>
</div>
</div>
</div>

<div style="position: absolute; left: 0; top: 134px; width: 390px; height: 710px; box-sizing: border-box; background-color: #ffffff; overflow: hidden">
<div class="vscroll" style="height: 710px; box-sizing: border-box; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 18px">
<section style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5e7482">Hoy</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{today}}" as="n" hint-placeholder-count="3">
<a class="card-link" href="{{n.href}}" style="display: flex; gap: 12px; padding: 10px 0; text-decoration: none; color: #0f2233">
<span style="width: 40px; height: 40px; border-radius: 12px; background-color: {{n.tileBg}}; color: {{n.tileFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 14px; line-height: 19px; font-weight: 700">{{n.title}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5e7482; white-space: nowrap">{{n.time}}<sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}"><span aria-label="Sin leer" style="width: 8px; height: 8px; border-radius: 999px; background-color: #a8e03a"></span></sc-if></span>
</div>
<span style="font-size: 13px; line-height: 18px; color: #5e7482">{{n.text}}</span>
</div>
</a>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5e7482">Esta semana</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{week}}" as="n" hint-placeholder-count="3">
<a class="card-link" href="{{n.href}}" style="display: flex; gap: 12px; padding: 10px 0; text-decoration: none; color: #0f2233">
<span style="width: 40px; height: 40px; border-radius: 12px; background-color: {{n.tileBg}}; color: {{n.tileFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 14px; line-height: 19px; font-weight: 700">{{n.title}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5e7482; white-space: nowrap">{{n.time}}<sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}"><span aria-label="Sin leer" style="width: 8px; height: 8px; border-radius: 999px; background-color: #a8e03a"></span></sc-if></span>
</div>
<span style="font-size: 13px; line-height: 18px; color: #5e7482">{{n.text}}</span>
</div>
</a>
</sc-for>
</div>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const unread = { bg: '#f8fdee', border: 'rgba(168, 224, 58, 0.45)', unread: true };
const read = { bg: '#ffffff', border: '#e4f5fc', unread: false };
const lime = { tileBg: '#a8e03a', tileFg: '#ffffff' };
const blue = { tileBg: '#e4f5fc', tileFg: '#1f93c2' };
const I = {
  bolt: 'M13 2 4 14h7l-1 8 9-12h-7z',
  in: 'M12 19V5M5 12l7 7 7-7',
  goal: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
  bulb: 'M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4',
  sync: 'M21 12a9 9 0 0 1-15 6.7L3 16M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M3 21v-5h5',
  card: 'M2 7h20v12H2zM2 11h20'
};
return {
  today: [
    Object.assign({ icon: I.bolt, title: 'Servicios públicos', time: '9:12', text: 'Vence en 2 días: $186.000.', href: 'VerdeBilletera.dc.html' }, unread, lime),
    Object.assign({ icon: I.in, title: 'Salario recibido', time: '8:05', text: 'Entraron +$5.200.000 a Bancolombia.', href: 'VerdeDashboard.dc.html' }, unread, blue),
    Object.assign({ icon: I.bulb, title: 'Nueva recomendación', time: '7:30', text: 'Podrías ahorrar $56.800 al mes en suscripciones.', href: 'VerdeRecomendaciones.dc.html' }, unread, lime)
  ],
  week: [
    Object.assign({ icon: I.goal, title: 'Viaje a Cartagena', time: 'Lun', text: 'Llegaste al 64 % de tu meta.', href: 'VerdeDashboard.dc.html' }, read, blue),
    Object.assign({ icon: I.sync, title: 'Nu Bank sincronizada', time: 'Dom', text: 'Tus movimientos están al día.', href: 'VerdeDetalleCuentas.dc.html' }, read, blue),
    Object.assign({ icon: I.card, title: 'Streaming de video', time: 'Sáb', text: 'Se renueva el 28 sep por $38.900.', href: 'VerdeBilletera.dc.html' }, read, blue)
  ]
};
}
}
</script>
</body>
</html>
