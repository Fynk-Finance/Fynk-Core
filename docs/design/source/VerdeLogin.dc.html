<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>App azul y verde · Iniciar sesión</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;background:#ffffff;color:#0f2233}
a{color:#5a8a0c}a:hover{color:#4a7409}
.field{transition:border-color .2s ease,background-color .2s ease}
.field:focus-within{border-color:#2fa8d8 !important;background-color:#ffffff !important}
.field input{border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;color:#0f2233;flex-grow:1;min-width:0;height:100%}
.field input::placeholder{color:#8a9ba6}
.eye{cursor:pointer;border:none;background:none;padding:0;color:#5e7482;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px}
.eye:hover{background-color:#e4f5fc}
.eye:focus-visible,.cta:focus-visible,.link:focus-visible{outline:3px solid #b5e5f7;outline-offset:2px}
.cta{cursor:pointer;transition:background-color .2s ease,transform .2s ease}
.cta:hover{background-color:#93cc26 !important}
.cta:hover .cta-arrow{transform:translateX(4px)}
.cta-arrow{transition:transform .25s ease}
@keyframes lg-shine{0%,62%{transform:translateX(0)}86%,100%{transform:translateX(620px)}}
.shine{animation:lg-shine 8s ease-in-out infinite 1.5s}
@keyframes lg-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.sheet{animation:lg-rise .6s ease-out both .1s}
@media (prefers-reduced-motion:reduce){.shine,.sheet{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #2fa8d8; position: relative; overflow: hidden">
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; top: 0; left: 0">
<rect x="226" y="-86" width="230" height="230" rx="52" fill="#3ab3e3"></rect>
<rect x="296" y="-30" width="116" height="116" rx="28" fill="#47b6e2"></rect>
<rect x="-70" y="196" width="170" height="170" rx="40" fill="#279dcc"></rect>
<rect x="40" y="150" width="58" height="58" rx="16" fill="#3ab3e3"></rect>
<rect x="300" y="236" width="74" height="74" rx="20" fill="#279dcc"></rect>
<g class="shine"><rect x="-140" y="-40" width="56" height="460" fill="#ffffff" fill-opacity=".12" transform="skewX(-18)"></rect></g>
</svg>

<div style="position: relative; padding: 48px 24px 0; display: flex; flex-direction: column; gap: 26px; color: #ffffff">
<div role="img" aria-label="Fynk" style="display: flex; align-items: center; gap: 10px">
<svg width="34" height="42" viewBox="80 20 510 640" aria-hidden="true" style="flex-shrink: 0; display: block"><g transform="matrix(1,-0.16,0,1,0,0)" fill="#ffffff"><path d="M130,126 H540 Q570,126 570,156 V230 Q570,252 548,252 H262 Q240,252 240,274 V383 Q240,405 262,405 H548 Q570,405 570,427 V531 Q570,561 540,561 H130 Q100,561 100,531 V156 Q100,126 130,126 Z"></path><rect x="262" y="268" width="120" height="120" rx="38"></rect><path d="M152,588 H345 V680 Q345,696 330,689 Z"></path></g></svg>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; line-height: 32px; letter-spacing: -0.01em">Fynk</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 34px; line-height: 40px; letter-spacing: -0.02em">Hola de nuevo</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Cada paso cuenta para tus metas.</p>
</div>
</div>

<div class="sheet" aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 645px; background-color: #a8e03a; box-shadow: 0 -12px 30px -20px rgba(15, 34, 51, 0.35); border-top-left-radius: 24px; border-top-right-radius: 24px; border-bottom-right-radius: 0px; border-bottom-left-radius: 0px"></div>
<form class="sheet" aria-label="Iniciar sesión" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 631px; box-sizing: border-box; margin: 0; background-color: #ffffff; border-radius: 32px 32px 0 0; box-shadow: 0 -12px 30px -20px rgba(15, 34, 51, 0.45); padding: 36px 24px 32px; display: flex; flex-direction: column; gap: 0px">
<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 36px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; line-height: 34px; letter-spacing: -0.01em">Inicia sesión</h2>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #5e7482">Usa el correo con el que te registraste.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px">
<label for="login-email" style="font-size: 14px; line-height: 20px; font-weight: 600">Correo electrónico</label>
<div class="field" style="display: flex; align-items: center; gap: 10px; height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #e4f5fc; background-color: #f4fbfe">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f93c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 4h16v16H4z"></path><path d="m4 7 8 6 8-6"></path></svg>
<input id="login-email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px">
<label for="login-pass" style="font-size: 14px; line-height: 20px; font-weight: 600">Contraseña</label>
<div class="field" style="display: flex; align-items: center; gap: 10px; height: 56px; box-sizing: border-box; padding: 0 8px 0 16px; border-radius: 14px; border: 1.5px solid #e4f5fc; background-color: #f4fbfe">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f93c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<input id="login-pass" type="{{pwType}}" autocomplete="current-password" placeholder="Tu contraseña">
<button class="eye" type="button" aria-label="{{eyeLabel}}" aria-pressed="{{eyePressed}}" onClick="{{toggle}}">
<sc-if value="{{show}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6 0 10 7 10 7a17.6 17.6 0 0 1-3.2 3.9M6.6 6.6C3.9 8.4 2 12 2 12s4 7 10 7a9.7 9.7 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></sc-if>
<sc-if value="{{hidden}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
</button>
</div>
<a class="link" href="VerdeRecuperar.dc.html" style="align-self: flex-end; margin-top: 4px; font-size: 13px; line-height: 18px; font-weight: 700; text-decoration: none; color: #177fa9">¿Olvidaste tu contraseña?</a>
</div>

<a class="cta" href="VerdeDashboard.dc.html" style="margin-top: 0px; box-sizing: border-box; text-decoration: none; height: 56px; width: 100%; border-radius: 16px; background-color: #2fa8d8; color: #ffffff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; flex-shrink: 0">
<span>Ingresar</span>
<svg class="cta-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a>

<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; margin: 24px 0">
<span style="flex-grow: 1; height: 1px; background-color: #e4ecf0"></span>
<span style="font-size: 13px; line-height: 18px; color: #8a9ba6">o ingresa con</span>
<span style="flex-grow: 1; height: 1px; background-color: #e4ecf0"></span>
</div>
<button type="button" style="cursor: pointer; height: 56px; width: 100%; box-sizing: border-box; border-radius: 16px; border: 1.5px solid #e4ecf0; background-color: #ffffff; color: #0f2233; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; flex-shrink: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2fa8d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11v3a8 8 0 0 1-1 4"></path><path d="M8.5 10a3.5 3.5 0 0 1 7 1v2a12 12 0 0 1-.6 4"></path><path d="M5.5 8.5A7 7 0 0 1 19 11v1"></path><path d="M5 13a14 14 0 0 0 .5 3"></path><path d="M18.5 16a16 16 0 0 0 .4-2"></path><path d="M8.8 14a10 10 0 0 1-.6 4"></path></svg>
<span>Huella o Face ID</span>
</button>

<p style="margin: auto 0 0; text-align: center; font-size: 14px; line-height: 20px; color: #5e7482">¿No tienes cuenta? <a class="link" href="VerdeRegistro.dc.html" style="font-weight: 700; text-decoration: none">Regístrate</a></p>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const show = !!(this.state && this.state.show);
return {
  show: show,
  hidden: !show,
  pwType: show ? 'text' : 'password',
  eyeLabel: show ? 'Ocultar contraseña' : 'Mostrar contraseña',
  eyePressed: show ? 'true' : 'false',
  toggle: () => this.setState({ show: !show })
};
}
}
</script>
</body>
</html>
