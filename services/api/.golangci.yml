# golangci-lint v2 config for the Fynk API.
# Module isolation (CLAUDE.md, Conflict rules): internal/<a> may import internal/<b>
# only through internal/<b>/ports. internal/platform is shared by everyone.
# internal/app and cmd are the composition root and may import anything.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert
  settings:
    depguard:
      rules:
        identity:
          list-mode: lax
          files:
            - "**/internal/identity/**"
          allow:
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/identity
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/platform
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/backup/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/consents/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/bank/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/catalog/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/recommendations/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/privacy/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/audit/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/market/ports
          deny:
            - pkg: github.com/Fynk-Finance/Fynk-Core/services/api/internal/
              desc: "Another module is reachable only through its ports package (internal/<module>/ports)."
        backup:
          list-mode: lax
          files:
            - "**/internal/backup/**"
          allow:
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/backup
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/platform
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/identity/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/consents/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/bank/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/catalog/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/recommendations/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/privacy/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/audit/ports
            - github.com/Fynk-Finance/Fynk-Core/services/api/internal/market/ports
          deny:
            - pkg: github.com/Fynk-Finance/Fynk-Core/services/api/internal/
